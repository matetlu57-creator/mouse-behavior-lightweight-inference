version = 1

[commands]
lint = [["{python}", "-m", "ruff", "check", "src", "scripts", "tests", "tools"]]
compile = [["{python}", "-m", "compileall", "-q", "src", "scripts", "tests", "tools"]]
tests = [["{python}", "-m", "pytest", "-q"]]
repository = [["{python}", "scripts/validate_repository.py"]]
build = [["{python}", "-m", "build", "--no-isolation"]]

[profiles]
local = ["lint", "compile", "tests"]
ci = ["lint", "compile", "tests", "repository", "build"]
