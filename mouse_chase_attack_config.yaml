# 多鼠ID+Pose异常骨架修复版 v1.20.0
# detector_first.use_detector_model=true：需要把 mouse_1280_200_yolo11n.pt
# 放在主程序同目录，或把 detector_first.model 改成实际绝对路径。

# 服务器数据盘布局。主程序也支持 MOUSE_BEHAVIOR_DATA_ROOT 覆盖 data_root。
paths:
  data_root: /NVme1/zhaojun
  datasets: datasets
  outputs: outputs
  projects: projects
  checkpoints: checkpoints
  default_video: 3_20mice_w_tag_rgb.mp4
  default_model: best.pt
model:
  imgsz: 960
  conf: 0.08
  iou: 0.5
  max_det: 40
  device: 0
  tracker: bytetrack_mouse20.yaml
  max_mice: 20
  half: true
detector_first:
  # v1.11.1：默认启用。三路融合：检测模型全图找黑鼠框；亮斑通道找白鼠；
  # Pose模型按训练方式做全图推理，关键点匹配回候选框。
  # 注意：本配置段承载v1.12.x的Pose主通道融合管线，enabled必须保持true！
  enabled: true
  # v1.12.4：检测器模型只是**可选补充通道**（Pose漏检时补缺、超大框拆分证据）。
  # Pose模型（best.pt）才是主通道，一鼠一框/骨架/ID逻辑与检测器无关。
  # false：只用一个关键点模型即可运行，不再需要 mouse_1280_200_yolo11n.pt；
  # true：放回检测器模型可增强黑鼠召回兜底（模型文件放代码目录或改model路径）。
  use_detector_model: false
  model: mouse_1280_200_yolo11n.pt
  detector_imgsz: 1280
  detector_conf: 0.12
  detector_iou: 0.5
  detector_max_det: 40
  half: true
  # Pose模式：full_frame（默认，按模型训练方式全图推理，关键点匹配回框）；
  # roi（旧模式，逐ROI姿态推理，仅当Pose模型是ROI训练时使用）。
  pose_mode: full_frame
  # v1.12.2：960→1280。2044px宽的原帧压到960后单鼠仅55~75px，关键点定位
  # 天然粗糙（目标图那种完整骨架需要更多像素）；1280下单鼠约75~100px。
  # RTX 3050可承受；若帧率明显下降回退960，若关键点仍稀疏可试1536。
  pose_full_imgsz: 1280
  pose_full_conf: 0.08
  pose_full_iou: 0.5
  pose_full_max_det: 40
  pose_half: true
  # 全图Pose关键点与候选框的匹配条件
  pose_match_expand_ratio: 0.15
  pose_match_min_inbox_ratio: 0.5
  pose_match_min_iou: 0.2
  # 白色小鼠亮斑检测通道（顶帽变换，无需训练模型）：
  # 白鼠在灰色地面上是显著亮目标；静止反光假斑由静态拒绝+运动门控晋升过滤。
  white_blob:
    enabled: true
    # Pose已经给足20只时不再做整幅顶帽/形态学扫描；只有少检帧才启动白鼠兜底。
    skip_when_pose_count_at_least: 20
    kernel_px: 41
    bright_delta: 22
    open_kernel_px: 5
    close_kernel_px: 21
    min_area_px: 2500
    # v1.11.3：上限放宽——贴近镜头边缘的白鼠体型明显更大（实测约160x200）
    max_area_px: 45000
    min_aspect_ratio: 0.3
    max_aspect_ratio: 3.5
    # 掩码像素亮度必须比周围地面高出该值（真白鼠约+60，黑鼠高光假斑为负）
    min_mask_surround_contrast: 20
    surround_ring_px: 25
    # v1.11.3：亮斑贴画面边缘时环带样本不足，改用绝对亮度兜底
    # （真白鼠体表掩码亮度实测180~255，墙角反光极少达到165）
    edge_abs_bright_min: 165
    blob_conf: 0.2
    max_blobs: 12
  # Pose主通道融合（v1.12.0，按文档§5：YOLO-Pose输出为唯一权威检测流）。
  # 检测器框/亮斑仅补缺：与Pose框同目标且尺寸相近（面积比<mega_box_size_ratio）
  # 则丢弃；尺寸悬殊说明Pose框是覆盖多鼠的超大框，补充框是其中独立一只（白鼠），
  # 保留；超大框被≥2个补充框嵌入时丢弃超大框并转移关键点。
  cross_channel_merge:
    enabled: true
    same_mouse_center_body_lengths: 0.45
    same_mouse_min_iou: 0.15
    mega_box_size_ratio: 1.6
    # v1.12.4 关键点锚定同目标去重：Pose框自身/最终候选统一终审，
    # 消除"一只鼠多个框多个TMP"。双方有骨架时按关键点簇质心距判定，
    # 相邻真鼠骨架簇相距≥0.5倍体长不会被误并。
    kp_same_mouse_body_lengths: 0.30
    # 仅一方有骨架时（检测器框/亮斑 vs Pose框）用更紧阈值，保护贴背/骑跨的
    # 相邻白鼠亮斑不被并进黑鼠。
    kp_same_mouse_unkeyed_body_lengths: 0.20
    kp_dedup_min_conf: 0.10
  # v1.12.7：骨架解剖学不可信（域外典型失效：高置信点挤作一团/散出框外）
  # 时跟踪/几何中心回退到检测框中心——模型关键点在裸板场地系统性错位，
  # 但框仍可靠，关键点加权中心被拉偏会污染匹配代价与行为几何。
  tracking_center_fallback: true
  tracking_center_anatomy_min_conf: 0.20
  tracking_center_anatomy_span_ratio: 0.45
  # 场地地面多边形掩码（v1.11.2）：中心落在多边形(+容差)外的候选一律拒绝。
  # 用于拦截墙壁镜像影子、场外杂物。当前多边形按 2044x1080 视频实测
  # （左墙内缘x≈355、右墙斜边(1640,25)→(1575,1065)、前墙y≈1065）；
  # 换视频/换场地后必须重新标注四个角点！
  arena_mask:
    enabled: true
    tolerance_px: 12
    polygon:
    - [355, 25]
    - [1640, 25]
    - [1575, 1065]
    - [355, 1065]
    # 没有多边形时的简化替代：按画面四边距裁剪（全0表示不用）
    frame_border_margin: {left_px: 0, right_px: 0, top_px: 0, bottom_px: 0}
  # 镜像影子对判别：溢进地面边缘的反光（更贴边界、无姿态、体型相近者判为影子；
  # 白鼠亮斑通道豁免——真白鼠本就贴墙活动）
  # v1.11.3：墙上影子/水痕也可能被Pose误画骨架（带姿态证据），对带姿态嫌疑者
  # 追加"姿态更弱 + 本体更淡 + 非亮目标"物证（需主程序传入灰度帧）。
  reflection_pair:
    enabled: true
    max_distance_body_lengths: 2.6
    boundary_band_px: 90
    max_size_log_ratio: 0.35
    # 有原图灰度物证时允许影子与真鼠体型不同，再由贴墙和对比度共同裁决。
    max_size_log_ratio_with_contrast: 1.0
    pose_quality_ratio: 0.9    # 嫌疑者姿态置信度须 < 真鼠侧 × 该值
    contrast_margin: 0.15      # 嫌疑者暗部/背景比值须 > 真鼠侧 + 该值（更淡）
    bright_object_factor: 1.3  # 最亮40% > 背景×该值 → 亮目标（真白鼠）豁免
  # ---- 以下为 pose_mode: roi 时使用的参数（保留兼容） ----
  roi_padding_ratio: 0.18
  pose_roi_imgsz: 384
  pose_conf: 0.025
  pose_iou: 0.4
  pose_max_det_per_roi: 3
  use_white_invert: true
  white_threshold: 0.5
  accept_bbox_without_pose: true
  candidate_filter:
    min_box_area_ratio: 0.00045
    max_box_area_ratio: 0.1
    min_long_side_ratio: 0.38
    max_long_side_ratio: 2.8
    min_area_ratio_to_reference: 0.16
    max_area_ratio_to_reference: 5.5
    max_aspect_ratio: 5.5
    bbox_only_min_conf: 0.16
    reference_history: 600
    reference_min_conf: 0.24
    reference_min_pose_quality: 0.28
    static_cell_px: 28
    static_reject_frames: 45
    static_max_conf: 0.3
    static_pose_quality_max: 0.12
    # v1.11.3：带弱姿态（水痕被误画骨架）但长期静止的候选，用更长窗口拒绝
    static_reject_frames_with_pose: 150
    static_pose_quality_max_with_pose: 0.5
    # v1.28：显著偏小且低置信的Pose候选先证明有真实位移，过滤水渍伪骨架。
    small_pose_require_motion: true
    small_pose_max_long_ratio: 0.72
    small_pose_max_area_ratio: 0.42
    small_pose_max_conf: 0.45
    small_pose_motion_min_hits: 3
    small_pose_motion_min_reference: 0.12
    small_pose_motion_min_px: 12
    small_pose_match_distance_reference: 0.55
    small_pose_track_ttl_frames: 12
    # v1.24.1：无姿态亮斑先证明自己在移动，才进入身份分配。
    # 防止脱落标签/纸片以Pxx出现并在3帧后晋升为正式ID。
    pose_free_blob_require_motion: true
    pose_free_blob_motion_min_hits: 3
    pose_free_blob_motion_min_reference: 0.25
    pose_free_blob_motion_min_px: 24
    pose_free_blob_match_distance_reference: 0.90
    pose_free_blob_track_ttl_frames: 10

# v1.40：在正式ID分配前，从全视频运动轨迹热力图学习笼子地面边界。
# 笼子按矩形处理：最大连通运动区域取轴对齐外接矩形，再向内收缩3%。
# 比例值0.97表示-3%；边界外候选不能创建或接管正式ID。
adaptive_arena:
  enabled: true
  boundary_expansion_ratio: 0.97
  # Each video learns its own polygon by default.  Reuse is only for rerunning
  # the same video, and the saved source path/file fingerprint must match.
  reuse_boundary_json: ""
  reuse_require_video_match: true
  min_box_confidence: 0.12
  min_pose_quality: 0.08
  min_motion_px_per_frame: 1.5
  max_motion_px_per_frame: 120.0
  min_motion_samples: 300
  long_track_min_frames: 30
  max_track_gap_frames: 2
  heatmap_cell_px: 20
  heatmap_blur_sigma_cells: 1.25
  heatmap_positive_quantile: 0.20
  heatmap_min_density: 0.08
  heatmap_close_radius_cells: 3
  heatmap_dilate_radius_cells: 2
  min_boundary_area_ratio: 0.20
  max_boundary_area_ratio: 0.95
  hard_gate_tolerance_px: 2.0
keypoints:
  names:
  - nose
  - left ear
  - right ear
  - base of neck
  - left hip
  - right hip
  - base of tail
  min_confidence: 0.2
  # v1.11.4：平滑器专用阈值，必须与渲染阈值一致（0.1）。
  # 旧逻辑直接用上面的0.2，会把模型以0.10~0.20置信度给出的nose/tail端点
  # 从平滑流中抹除——骨架缺两个端点后呈"蝴蝶结"，这是裸板场地上
  # 关键点置信度整体偏低时的主要视觉缺陷。
  smoothing_min_confidence: 0.12
  # 端点短暂丢失时的插值帧数（0.13秒内保端点防闪烁）
  interpolation_max_frames: 8
  # v1.12.4：插值点置信度按 last_raw×decay^缺失帧 衰减、地板为smoothing_min_confidence。
  # 旧版插值点置信度=0被渲染阈值过滤，插值从未生效——端点一丢就消失、骨架稀疏。
  interpolation_conf_decay: 0.82
  smoothing_alpha: 0.7
pose_recovery:
  # v1.20：仅对异常骨架进行ROI二次推理。全图正常骨架不会重复推理。
  enabled: true

  # ---------- 全图骨架质量门控 ----------
  quality_min_confidence: 0.12
  min_valid_keypoints: 5
  min_skeleton_span_ratio: 0.42
  min_nose_tail_bbox_ratio: 0.35
  max_outside_keypoints: 2
  quality_bbox_margin_ratio: 0.20
  min_quality_score: 0.52
  min_bone_valid_ratio: 0.50
  min_bone_length_bbox_ratio: 0.025
  max_bone_length_bbox_ratio: 0.82

  # ---------- 坏骨架ROI二次推理 ----------
  # 每帧最多恢复6只，避免20鼠视频在最坏情况下额外执行20次Pose。
  max_roi_per_frame: 6
  roi_expand_ratio: 0.40
  roi_imgsz: 640
  roi_conf: 0.04
  roi_iou: 0.45
  roi_max_det: 3
  min_score_improvement: 0.06
  max_candidate_center_shift_body_lengths: 0.75
  min_candidate_iou: 0.02
  # 默认保留全图检测框，仅替换7关键点，防止ROI框尺寸抖动污染ID。
  replace_bbox: false

  # ---------- 身份分配后的逐关键点时序门控 ----------
  temporal:
    temporal_min_confidence: 0.10
    temporal_gate_body_lengths: 0.35
    speed_gate_scale: 3.0
    min_temporal_gate_px: 4.0
    temporal_bbox_margin_ratio: 0.28
    # 整套骨架严重挤成一团时禁止写入历史；无可靠历史时回退只画检测框。
    suppress_severely_bad_pose: true
    severe_bad_span_ratio: 0.28
    severe_bad_nose_tail_ratio: 0.20
    prediction_max_frames: 8
    max_prediction_frames: 8
    prediction_conf_decay: 0.82
    prediction_render_confidence: 0.11
    smoothing_alpha: 0.70
    velocity_alpha: 0.55
    velocity_window_frames: 7

    # v1.39：DISK论文思想的在线因果版本。使用较长的可靠历史和缺失掩码
    # 补短时关键点空洞；只参与核查视频渲染，不进入行为几何与事件判定。
    disk_sequence:
      enabled: true
      history_frames: 30
      min_history_frames: 6
      regression_window_frames: 18
      max_prediction_frames: 12
      min_confidence: 0.10
      render_max_uncertainty_body_lengths: 0.45
      uncertainty_gate_scale: 2.5
      history_min_keypoints: 4
      uncertainty_floor_body_lengths: 0.06
      uncertainty_growth_body_lengths: 0.035
      max_uncertainty_body_lengths: 0.60
      max_speed_body_lengths_per_frame: 0.35

    # 历史高质量骨架模板只补视频显示；模板点不会单独触发攻击/接触。
    template_repair_enabled: true
    template_min_good_frames: 8
    template_min_reliable_keypoints: 5
    template_min_anchors: 3
    template_ema_alpha: 0.12
    template_bbox_margin_ratio: 0.28
    template_render_confidence: 0.105

visualization:
  render_raw_keypoints: false
  raw_min_confidence: 0.05
  clean_render_only: true
  draw_pair_arrows: false
  show_behavior_panel: false
  show_mouse_id: true
  constrain_keypoints_to_bbox: true
  # v1.11.4：框边距放宽——尾根/鼻尖常落在检测框边缘外12%之外被误裁
  bbox_margin_ratio: 0.2
  max_bone_length_bbox_diagonal_ratio: 0.72
  # v1.12.3：用户确认要框——但每只鼠只画一个框（一鼠一框由v1.12.0
  # Pose主通道融合保证：超大框拆分+跨通道去重，不会再叠三四个框）。
  # 画面 = 单个检测框 + 骨架连线 + 关键点彩点 + 干净ID标签。
  skeleton_id_only: false
  draw_bbox: true
  keypoint_palette: true   # 关键点逐点一色（类YOLO可视化风格）
  box_thickness: 2
  skeleton_thickness: 2
  point_radius: 4
  nose_point_radius: 5

# v1.23：所有去重后的YOLO检测都进入最终核查视频。
# 正式ID尚未确认时，使用独立Pxx短时显示轨迹；Pxx不参与行为统计、
# 不污染正式ID记忆，正式身份确认后自动消失并切换为ID n。
provisional_render:
  enabled: true
  # v1.29: 短时漏检时继续沿用原正式 ID 的渲染框，避免视频里出现一闪而过的 ID 缺失。
  # 该保持只用于可视化，不写入行为几何，也不会把墙面候选提升为正式 ID。
  max_missing_frames: 15
  match_gate_body_lengths: 1.35
  iou_weight: 0.22
  size_weight: 0.10
  max_match_cost: 1.35
  velocity_alpha: 0.60
  promoted_overlap_iou: 0.35
  promoted_distance_body_lengths: 0.45
  max_tracks: 40

identity:
  # v1.14.0：使用从旧双鼠PureKeypointTracker扩展而来的多鼠逐关键点运动追踪。
  # 不再因匹配边际接近而把已建立ID主动断成TMP。
  mode: keypoint_motion

  # ============ v1.14.0 多鼠逐关键点运动身份分配 ============
  # 迁移旧双鼠PureKeypointTracker的核心：
  # 逐关键点速度/加速度预测 + 置信度掩码中位距离 + 匈牙利全局匹配。
  # 第一帧按空间顺序直接分配固定ID，不再经历TMP→ID改号。
  keypoint_motion:
    # v1.29: 延长正式轨迹保留窗口，覆盖骑乘/扭打后约5秒的检测空窗，
    # 让轨迹桥接有机会把持续出现的同一只鼠接回旧 ID，而不是创建 ID20 之类的新号。
    max_missing_frames: 180
    min_keypoint_confidence: 0.10
    min_common_keypoints: 2      # 至少2个共同可信点启用逐关键点代价
    prediction_max_frames: 30    # 状态保留上限；实际位移另由下列体长门封顶
    # 加速度只外推极短时遮挡；之后维持限速速度，并将总位移封顶。
    # 这防止坏骨架导数在漏检后平方放大，造成预测框乱飞和真实检测无法重连。
    prediction_acceleration_max_frames: 3
    prediction_max_speed_body_lengths_per_frame: 0.35
    prediction_max_displacement_body_lengths: 1.25
    velocity_alpha: 0.60         # 对应旧追踪器速度更新0.4旧+0.6新
    acceleration_alpha: 0.35
    center_velocity_alpha: 0.65
    body_length_alpha: 0.15
    base_gate_body_lengths: 1.15
    speed_gate_scale: 4.0        # 对应旧追踪器BMD + speed×4
    missing_gate_growth: 0.20
    max_gate_body_lengths: 3.20
    max_assignment_cost: 1.25

    # v1.29: 将持续出现的临时 Pxx 轨迹接回唯一缺失的正式 ID。
    # 只在候选至少连续命中、姿态/体型可信且旧轨迹仍在保留窗内时执行，
    # 因此不会把静态水渍、影子或单帧重复框直接改成正式 ID。
    tracklet_bridge:
      enabled: true
      min_provisional_hits: 3
      min_missing_frames: 2
      max_missing_frames: 180
      max_bridge_score: 1.15
      max_pose_cost: 1.20
      max_body_ratio: 2.0
      min_box_confidence: 0.18
      min_pose_quality: 0.42
      min_motion_body_lengths: 0.10
      # 唯一旧ID与次优旧ID的分数差不足时保持匿名，不允许P轨迹抢占正式ID。
      min_bridge_margin: 0.18
    render_max_missing_frames: 15
    render_confidence_decay: 0.88
    render_block_gate_body_lengths: 0.75

    # v1.19：每条轨迹可选择本帧Dummy空匹配，避免正确检测缺失时硬跳到别鼠。
    unmatched_cost: 1.08
    unmatched_cost_growth: 0.025

    # 遮挡时鼻尾距离可能收缩，使用bbox长边补充身份尺度并增加物理硬门。
    robust_bbox_body_scale: 0.75
    hard_size_ratio_min: 0.38
    hard_size_ratio_max: 2.65
    hard_gate_base_body_lengths: 1.90
    hard_gate_missing_growth: 0.32
    hard_gate_max_body_lengths: 3.30
    confidence_cost_weight: 0.02

    # v1.21：完全自适应鼠数，不再要求填写固定数量。
    # model.max_mice=20只作为安全上限，不代表视频必须有20只。
    expected_mice_count: 0

    # 旧字段继续保留兼容，但实际由adaptive_count中的参数接管。
    new_track_confirm_frames: 4
    pending_match_distance_body_lengths: 0.90
    pending_ttl_frames: 12
    max_new_tracks_per_frame: 3

    # v1.28.1：简单接触期间以框中心运动为主，禁止交叉骨架污染身份模板。
    contact_identity_guard:
      enabled: true
      distance_body_lengths: 1.35
      overlap_iou: 0.02
      hold_frames: 6
      motion_cost_weight: 0.90
      velocity_update_alpha: 0.15
      max_assignment_cost: 0.70
      # 接触合并期间保留进入接触前的纵向顺序，分离时禁止两只鼠交叉换号。
      order_hold_frames: 45
      order_min_reversal_body_lengths: 0.12
      # 只为双方都在运动且方向一致的追逐鼠对建立顺序记忆，排除路旁静止鼠。
      order_min_speed_body_lengths_per_frame: 0.015
      order_min_direction_cosine: 0.20
      # 回退到旧版接触身份基线；不启用v1.34的一动一停孤立接触顺序锁。
      allow_isolated_pair: false
      # 顺序反转证据成立时使用的专用提交门；普通接触仍保持0.70的严格门限。
      order_max_assignment_cost: 1.05
      # 墙边阴影、尾部残影或脱落标签的低置信度骨架不得参与两只正式ID的交换。
      # 0.12保留接触分离时约0.13的真实鼠，同时排除尾部约0.09的伪骨架。
      order_min_detection_confidence: 0.12
      # 若长时序对当前两条轨迹的支持比强制空间换位至少高0.10，则允许真交叉，
      # 避免“永远保持左右顺序”反而把两只真实小鼠的ID交换。
      order_disk_veto_margin: 0.10
      # DISK证据不足或难分胜负时，空间顺序规则最多只能让成对总代价增加0.20；
      # 防止接触排序以两个明显大跳为代价强行互换ID。
      order_max_pair_cost_increase: 0.20

    # v1.39：DISK式长时序一致性作为Hungarian辅助证据，并拒绝把明显跳到
    # 另一只鼠身上的观测写回身份历史。原始双向Transformer需另行训练。
    disk_sequence_guard:
      enabled: true
      backend: robust_causal
      history_frames: 30
      min_history_frames: 6
      regression_window_frames: 18
      max_prediction_frames: 12
      min_confidence: 0.10
      min_common_keypoints: 3
      cost_weight: 0.32
      min_reliability: 0.12
      update_min_box_confidence: 0.12
      update_min_keypoints: 4
      update_max_sequence_cost: 0.95
      update_check_min_center_jump_body_lengths: 0.35
      # 只在代价接近、高成本或刚漏检的轨迹行计算长时序，清晰帧保持低开销。
      activation_margin: 0.18
      activation_min_best_cost: 0.45
      activation_after_missing_frames: 1
      uncertainty_floor_body_lengths: 0.06
      uncertainty_growth_body_lengths: 0.035
      max_uncertainty_body_lengths: 0.60
      max_speed_body_lengths_per_frame: 0.35

    # v1.40：最终实际生效的Hungarian提交路径强制执行双边候选边际和跳跃硬门。
    # 模糊时宁可短暂缺框，也不把另一只鼠或墙影提交给当前正式ID。
    assignment_ambiguity_guard:
      enabled: true
      general_min_margin: 0.04
      contact_min_margin: 0.10
      recovery_min_margin: 0.10
      max_jump_body_lengths_per_frame: 0.80
      max_recovery_jump_body_lengths: 1.60
      unique_override_margin: 0.35
      unique_override_max_cost: 0.28
      # 只放行“上一帧已命中+非负双边边际+极小预测位移”的低边际续接。
      # 这类帧冻结外观/掩码模板；负边际、漏检恢复和大位移仍然拒绝。
      motion_hold_enabled: true
      motion_hold_min_margin: 0.0
      motion_hold_max_jump_body_lengths: 0.30
      motion_hold_max_cost: 0.70

    # 成熟ID槽在长遮挡后仅标记lost而不删除；弱启动伪迹仍会退役并复用0~19槽位。
    persistent_slots:
      enabled: true
      min_hits: 30

    adaptive_count:
      enabled: true
      # 视频开头的真实小鼠在7帧窗口内命中3次后建立正式ID。
      # 因此首帧反光、重复框不会直接污染整个视频。
      initial_confirm_hits: 3
      # 视频中途新进入画面的小鼠需要更严格的4次命中。
      new_track_confirm_hits: 4
      confirmation_window_frames: 7
      pending_max_gap_frames: 2
      pending_ttl_frames: 12

      # 候选池内部匹配：按身体长度归一化的位置、IoU和体型联合关联。
      pending_match_distance_body_lengths: 0.90
      pending_match_iou_weight: 0.18
      pending_match_size_weight: 0.12
      pending_max_match_cost: 1.05

      # 新ID建立质量门。坏骨架仍可依靠可靠bbox进入追踪，
      # 所以pose质量阈值保持为0，主要依靠检测置信度+连续出现过滤。
      min_box_confidence: 0.12
      min_pose_quality: 0.08
      min_candidate_score: 0.18
      min_average_score: 0.20

      # 首批ID允许相邻小鼠较近；中途新ID要与现有轨迹明显分离。
      initial_promotion_min_separation_body_lengths: 0.18
      later_promotion_min_separation_body_lengths: 0.35
      initial_max_new_tracks_per_frame: 20
      max_new_tracks_per_frame: 3

      # 仅用于输出自适应数量统计，不会把数量估计反过来变成硬上限。
      count_history_window_frames: 15

    initial_order: top_to_bottom_left_to_right
    new_track_min_separation_body_lengths: 0.35
    weak_track_drop_hits: 2
    weak_track_drop_missing_frames: 12
    reuse_expired_ids: true
    weights:
      keypoint: 0.56             # 主证据：预测关键点到当前关键点
      center: 0.24
      iou: 0.08
      heading: 0.06
      size: 0.06

  # 短时身份记忆模块（修复文档v1.1 §11~§12）。enabled=true 时主程序自动切换为
  # MemoryIdentityAssigner：检测与身份分离，每个当前检测都渲染；未匹配检测立即
  # 创建TMP临时轨迹；冲突时冻结身份记忆但保留检测框；lost轨迹保留TTL内重激活。
  # 旧MemoryIdentityAssigner保留在代码中，但本配置关闭；它的
  # simple_ambiguous_reject会在同外观多鼠靠近时主动断轨并不断创建TMP。
  memory:
    enabled: false
    window_frames: 30          # §12.7 MEMORY_WINDOW：各记忆历史长度
    velocity_window_frames: 7  # VELOCITY_WINDOW：速度中位数窗口
    suspicious_window_frames: 5  # SUSPICIOUS_WINDOW：可疑观察窗
    id_margin_threshold: 0.08  # ID_MARGIN_THRESHOLD：第一/第二候选最小边际
    lost_ttl_frames: 15        # LOST_TTL：已有ID漏检保留记忆帧数（§7/§9）
    ema_alpha: 0.10            # MEMORY_EMA_ALPHA：体型/外观EMA更新率
    confirm_frames: 2          # CONFIRM_FRAMES：TMP晋升固定槽位所需连续命中
    tmp_ttl_frames: 15         # TMP临时轨迹连续漏检后回收
    max_tentative_tracks: 10   # MAX_TENTATIVE_TRACKS：TMP容量（§7）
    recycle_lost_after_frames: 300  # §4.7：过期lost槽位清理，释放confirmed容量
    # 运动门控晋升（v1.11.3默认全源"*"）：任何TMP必须观察到足够位移才晋升。
    # 墙上水痕等静止假目标也可能被Pose误画骨架而携带姿态证据，
    # "持续位移"是真鼠的可靠证据；静止真鼠保持TMP显示（命中不过期），移动后晋升。
    promotion_motion_required_sources:
    - "*"
    promotion_min_displacement_body_lengths: 0.6
    # v1.12.4 并列晋升判据：活动范围直径≥0.5倍体长。抱团聚拢鼠净位移虽小，
    # 扭动仍让访问点集直径增大；静止水痕两项都停在抖动量级（≈0.1）永不晋升。
    promotion_min_diameter_body_lengths: 0.5
    # v1.12.6：接触簇内TMP累计稳定命中≥60帧（2秒）解除§12.8簇内禁升。
    # §12.8防ID给错鼠，但长期抱团的两只鼠永远等不到"离开簇"解禁（实跑
    # 左下角TMP持续200+帧）。设0恢复严格§12.8。
    contact_cluster_promote_min_total_hits: 60
    # v1.12.10 慢车道晋升：累计命中≥90帧（3秒）且骨架解剖学有效占比≥0.6的
    # TMP跳过"连续命中"与"运动门控"直接晋升——治静止抱团真鼠（位移/直径
    # 双双不达标的真个体，实跑TMP持续130+帧）与闪烁通道（连续命中凑不齐）。
    # 骨架证据把静止水痕/反光挡在门外（其骨架解剖学必坏）。设0关闭慢车道。
    slow_lane_promote_min_total_hits: 90
    slow_lane_min_keypoint_ok_ratio: 0.6
    slow_lane_min_motion_body_lengths: 0.25  # 抖动级运动下限：水痕抖动≈0.1体长，
                                 # 慢车道要求≥0.25（防"骨架画得像样的水痕"晋升）
    # v1.12.11 速度自适应跳变门：低速/静止的confirmed轨迹在≤2帧短间隔内不得
    # 接受远超运动能力的跳变——实跑中静止ID在1帧漏检后抓了0.9体长外的别鼠
    # 检测（身份被偷、端点污染、尾段跳变根源）。cap=max(min, scale×中位速度
    # +base)：静止0.5体长；追逐快鼠自动放宽，预测已含速度补偿不影响匀速追踪。
    jump_gate_min_body_lengths: 0.5
    jump_gate_speed_scale: 6.0
    jump_gate_base_body_lengths: 0.2
    # ============ v1.13.0 简洁运动身份模式（默认开）============
    # 只靠 轨迹段+位置+朝向+速度 判ID（用户指定的证据维度）：
    # ①匹配代价=运动预测+中心+朝向+尺度，不算外观直方图、不算OKS——
    #   更快，且接触时关键点交叉不再把代价带偏；
    # ②匈牙利匹配边际不足（贴近邻居且与次优差距小）时宁可断轨转lost，
    #   交轨迹段融合事后裁决——不冻结、不仲裁、不标可疑（旧状态机旁路）；
    # ③轨迹段融合评分加入朝向一致性，位置说不清的朝向说清；
    # ④每帧不再计算外观直方图特征，提速。
    simple_motion_mode: true
    simple_ambiguous_reject: true   # 边际不足宁可断轨（false则退回旧冻结/仲裁）
    # v1.12.5 轨迹段融合（参考苏峰博士论文§4.2.8 MOT-SP/§4.2.9 MOT-TP）：
    # 旧ID丢失超recycle_lost_after_frames被回收后，片段摘要（端点/框/速度）入池；
    # 新TMP晋升前用"最大值+差值"双条件融合回原ID——距离够近且领先第二名
    # 够多才融合（缺一按新个体，绝不勉强），修复旧ID回收后重领新ID的跳变。
    tracklet_fusion:
      enabled: true
      max_gap_frames: 600        # TempThre：片段端点到现在的最大帧间隔（含300帧回收等待）
      fragment_ttl_frames: 300   # 片段回收后再保留时长（与上项配合≈20秒内可融合回）
      dist_thre_body_lengths: 0.5    # DistThre（体长归一化；论文30px≈0.3~0.4体长）
      dist_diff_body_lengths: 0.25   # DistDiffThre：领先第二名的最小边际（防错配）
      iou_thre: 0.15             # TrackletIoUThre：短间隔OR门
      iou_diff_thre: 0.10        # TrackletIoUDiffThre
      iou_max_gap_frames: 30     # IoU的OR门只用于≤30帧短间隔；长间隔后任何鼠
                                 # 途经同一区域框都会重叠，IoU是弱证据会误融合
      velocity_predict_max_frames: 30  # MOT-TP：匀速预测延长上限（论文C-ANN≤6点）
      # v1.12.8 lost轨迹吸收（实跑残余跳变主因）：接触中老轨迹变lost但仍占槽，
      # 同一只鼠被新TMP接管，TMP晋升只能领新号（6→7）。晋升时对活着的lost
      # 轨迹跑同一套双条件门控，无争议就接回原ID。
      absorb_lost_tracks: true
      absorb_min_misses: 10        # lost轨迹须饿满10帧才候选（刚lost的不动）
      absorb_coexist_tolerance_frames: 5  # 共存守卫：它停止命中的时间不晚于
                                 # TMP创建+5帧（之后还在命中=另一只鼠，不吸收）
      # v1.12.10：①吸收评分的时间基准修正——速度外推只跨"未观测区间"
      # （候选端点→TMP创建点），不再按晋升帧顶满30帧上限过冲（实跑2→11
      # 跳变的直接原因）；②TMP死亡片段证据继承——闪烁通道（白鼠亮斑）的
      # TMP反复死亡重建，晋升证据不再每次清零。继承只搬晋升就绪度证据，
      # TMP没有身份，不涉及ID转移；距离门+边际门保证就近且无争议。
      tmp_chain_inherit: true
      tmp_chain_ttl_frames: 90          # 死亡TMP证据片段保留时长
      tmp_chain_dist_body_lengths: 0.5  # 继承距离门（新TMP创建点↔死亡端点）
      tmp_chain_margin_body_lengths: 0.25  # 继承边际门（防跨鼠继承）
      # v1.12.11 共存守卫位置豁免：lost轨迹在TMP创建后的命中点若仍在TMP起点
      # 附近（≤本体长），是"同一只鼠漏过去的检测"而非另一只鼠共存，放行交给
      # 评分门控裁决（实跑：lost轨迹在TMP漏检间隙原位命中一帧被误判共存）。
      absorb_coexist_override_body_lengths: 0.6
      # v1.13.0 融合评分朝向权重：评分=(1-w)×体长距离+w×朝向差（鼻→尾基
      # 体轴余弦距离）。位置说不清的朝向说清（0.56体长无竞争的同鼠曾被
      # 纯距离阈值拒绝；成对候选同距离时朝向决胜负）。
      fusion_heading_weight: 0.25
    # v1.11.3 近距离接触保护：接触中的鼠关键点互相交叉，姿态/外观证据不可靠。
    # 自动降低姿态/外观权重、身份边际阈值加倍——宁可冻结标ID?也不低置信互换。
    contact_crowd_body_lengths: 1.0
    contact_pose_weight_scale: 0.33
    contact_appearance_weight_scale: 0.5
    contact_margin_scale: 2.0
    normal_distance_gate_body_lengths: 1.2  # §7 NORMAL_DISTANCE_GATE（体长倍数）
    fast_distance_gate_body_lengths: 2.0    # §7 FAST_DISTANCE_GATE（体长倍数）
    fast_speed_gate_body_lengths_per_frame: 0.6  # 超过该速度启用高速门限
    max_assignment_cost: 1.05
    low_max_cost: 0.50
    # §12.4 匹配代价权重（关键点不足时自动退化为运动+中心+尺度，§6.6）
    weights:
      motion: 0.35
      center: 0.20
      pose: 0.15
      heading: 0.10
      size: 0.10
      appearance: 0.10
  candidate_extra: 10
  max_missing_frames: 100000000
  prediction_output_frames: 30
  missing_lock_decay: 0.008
  max_jump_body_lengths: 2.8
  max_assignment_cost: 1.2
  velocity_prediction_weight: 1.0
  raw_id_mismatch_penalty: 0.0
  raw_id_match_reward: 0.0
  ignore_color_for_identity: true
  white_invert_threshold: 0.55
  appearance_ema_alpha: 0.22
  appearance_long_ema_alpha: 0.035
  appearance_long_max_iou: 0.06
  appearance_long_min_pose_quality: 0.55
  pose_ema_alpha: 0.3
  appearance_max_iou: 0.18
  appearance_min_pose_quality: 0.2
  appearance_min_box_conf: 0.08
  close_contact_body_lengths: 1.3
  close_contact_gate_scale: 0.78
  commit_arbiter:
    enabled: true
    cooldown_frames: 60
    dwell_close: 12
    dwell_normal: 7
    dwell_far: 4
    min_gain_close: 0.12
    min_gain_normal: 0.08
    min_gain_far: 0.05
    immediate_gain: 0.28
    lock_threshold: 0.55
    missing_bypass_frames: 6
  new_track_confirm_frames: 10
  new_track_max_gap_frames: 2
  new_track_min_separation_body_lengths: 0.45
  cluster_accept_cost: 0.48
  cluster_min_assignment_margin: 0.1
  cluster_preserve_raw_id: true
  # 两阶段关联（ByteTrack思想）：高分检测全特征匹配，
  # 未匹配轨迹用低分检测纯运动/IoU回收，低分检测不参与外观和新ID创建。
  two_stage:
    enabled: true
    high_conf: 0.2
    high_pose_quality: 0.35
    low_max_cost: 0.42
  # 轨迹状态机：suspicious冻结外观并提高恢复门槛；
  # lost重激活必须同时满足运动可达+长期外观或OKS证据，错绑比短时丢失更糟。
  state_machine:
    enabled: true
    lost_after_frames: 60
    recover_confirm_frames: 3
    suspicious_margin: 0.06
    lost_accept_cost: 0.55
    lost_appearance_gate: 0.38
    lost_oks_gate: 0.4
  # 冲突对仲裁：边际不足且竞争者贴近时，用OKS+长期外观+锚点做最终裁决。
  hard_pair:
    enabled: true
    margin: 0.08
    close_body_lengths: 1.8
    min_arbitration_margin: 0.04
  # 短窗重拼接：两条轨迹的近期观测持续更像对方长期模板时执行ID互换回滚。
  restitch:
    enabled: true
    confirm_frames: 8
    # v1.12.1：对齐文档§7建议初值 BACKTRACK_WINDOW 15~30帧
    window_frames: 30
    cooldown_frames: 90
    min_improvement: 0.06
    min_appearance_updates: 6
  weights:
    center: 0.34
    velocity: 0.17
    pose: 0.12
    anchor: 0.13
    heading: 0.06
    size: 0.07
    appearance: 0.11
    white: 0.0
  legacy_slot:
    never_expire: true
    center_weight: 0.62
    bbox_iou_weight: 0.16
    pose_weight: 0.07
    anchor_weight: 0.06
    heading_weight: 0.03
    oks_weight: 0.06
    max_cost: 1.05
    max_jump_body_lengths: 3.2
    mutual_nearest_lock: true
    mutual_lock_cost: 0.72
    close_contact_hold: true
    close_contact_min_margin: 0.1
    general_min_margin: 0.025
    prediction_frames: 30
    new_track_confirm_frames: 6
    new_track_max_gap_frames: 3
    new_track_min_separation_body_lengths: 0.55
    new_track_duplicate_iou: 0.2
long_term_memory:
  enabled: true  # 保留自动策略总开关；false时所有视频都禁用长期身份模板。
  min_video_duration_seconds: 300.0  # 视频时长达到或超过300秒（5分钟）才开启长期记忆。

# 长视频按完整帧边界保存可恢复状态；短于5分钟的验证片不增加断点I/O。
checkpoint:
  enabled: true
  min_video_duration_seconds: 300.0
  interval_frames: 300

instance_mask_memory:
  # v1.22：当前权重为YOLO Pose，不输出实例分割。本模块在每个Pose框内用
  # 关键点种子+GrabCut构造伪实例掩码，并把轮廓/纹理/颜色描述绑定到逻辑ID。
  enabled: true
  roi_expand_ratio: 0.08
  grabcut_iterations: 1
  # 每个检测的GrabCut使用确定性线程局部RNG，保证跨进程A/B可复现。
  grabcut_deterministic_seed: 1739
  # 孤立框仅每15帧刷新一次GrabCut；接触/重叠框仍逐帧GrabCut。
  # 中间帧用关键点方向椭圆提取轻量描述，并复用固定工作线程池。
  fast_isolated_enabled: true
  grabcut_overlap_iou: 0.02
  grabcut_refresh_interval_frames: 15
  # 孤立鼠每3帧更新一次轻量椭圆描述；重叠/接触帧和15帧刷新帧仍全部做GrabCut。
  isolated_descriptor_interval_frames: 3
  persistent_executor: true
  min_box_side_px: 12
  descriptor_size: [32, 16]
  keypoint_seed_confidence: 0.10
  central_ellipse_scale: 0.78
  min_area_ratio: 0.12
  max_area_ratio: 0.78
  min_keypoint_coverage: 0.45
  max_border_fraction: 0.38
  min_quality: 0.34
  fallback_quality_scale: 0.55
  keep_local_mask: false

  # 接触分离时提高短时实例掩码权重，阻止两条运动预测交叉后互换ID。
  # 权重仍低于运动与物理门控总和，且重叠期间不会更新模板。
  identity_cost_weight: 0.32
  short_ema_alpha: 0.22
  long_ema_alpha: 0.035
  update_min_quality: 0.38
  long_update_min_quality: 0.52
  short_update_max_iou: 0.12
  long_update_max_iou: 0.04

cluster_reid:
  # v1.22.1：扎堆时冻结原ID，不强行逐帧猜；散开后先维护匿名tracklet，
  # 连续观察后再用双向运动+掩码+体型+方向做全局匈牙利匹配。
  enabled: true
  activate_on_ambiguity_only: true
  activation_iou: 0.15
  # v1.24.1：普通靠近/接触和框重叠不再触发Cxx匿名ID。
  # 仅在检测数量下降且出现合并大框时，才启动严格遮挡ReID。
  strict_occlusion_activation: true
  # v1.27：连续三帧都有“少检+同一大框覆盖两只鼠”证据才冻结ID。
  activation_confirm_frames: 3
  # v1.28：检测数未下降但密集中心骨架不可辨时，仅匿名化中心异常成员；
  # 外围骨架完整的小鼠继续保持正式ID。同一遮挡期复用同一个CXX簇和A/B/C后缀。
  partial_dense_enabled: true
  partial_dense_confirm_frames: 2
  partial_dense_release_stable_frames: 3
  partial_dense_min_neighbors: 2
  partial_dense_overlap_iou: 0.08
  partial_dense_contact_distance_body_lengths: 0.90
  partial_dense_mask_area_ratio_max: 0.24
  partial_dense_box_conf_max: 0.55
  partial_dense_track_gate_body_lengths: 0.85
  partial_dense_max_anonymous_members: 4
  partial_dense_cluster_id_base: 50
  region_expand_ratio: 0.35
  post_region_expand_ratio: 0.85

  tracklet_match_gate_body_lengths: 1.35
  # 中心检测短暂消失时保留匿名tracklet，避免CXX-A/B后缀跳号。
  tracklet_max_missing_frames: 20
  split_min_separation_body_lengths: 0.72
  split_stable_frames: 3
  # 分开后连续3帧建立稳定匿名轨迹即可尝试归还原ID，缩短CXX显示时间。
  post_split_min_tracklet_hits: 3
  post_split_max_wait_frames: 90

  assignment_max_average_cost: 0.85
  assignment_min_margin: 0.08
  motion_weight: 0.28
  backward_motion_weight: 0.18
  mask_weight: 0.26
  size_weight: 0.10
  heading_weight: 0.10
  topology_weight: 0.08
  motion_uncertainty_per_frame: 0.055
  motion_prediction_cap_frames: 18
  tracklet_mask_ema_alpha: 0.20

  # 只有至少稳定命中5帧的ID才进入聚集身份池，避免刚确认即被冻结。
  min_member_track_hits: 5
  # 聚集中/散开后，候选必须靠近成员或匿名tracklet预测位置；每个簇最多
  # 保留expected_count个检测，防止区域逐帧膨胀吞并其他小鼠。
  cluster_reserve_gate_body_lengths: 1.55
  post_reserve_gate_body_lengths: 1.85
  reserve_iou_weight: 0.16
  anonymous_id_base: 100000

duplicate_suppression:
  enabled: true
  # 保留v1.22.1已验证的保守去重：同时满足框、中心和姿态相似才删除。
  iou_threshold: 0.72
  small_box_overlap_threshold: 0.86
  center_distance_body_lengths: 0.20
  pose_distance_body_lengths: 0.20
occlusion_cluster:
  enabled: true
  track_max_age_frames: 20
  enter_distance_body_lengths: 1.2
  release_distance_body_lengths: 1.65
  release_stable_frames: 5
  region_padding_ratio: 0.4
  overlap_iou_threshold: 0.12
  merged_box_area_ratio: 1.45
  # v1.27：检测数只在成员预测位置附近做一对一统计，避免邻鼠进入大区域后误计数。
  observation_match_gate_body_lengths: 0.72
  observation_match_iou: 0.05
  # 大框必须同时覆盖至少两个成员预测框，单只白鼠的自然大框不算合并。
  merged_member_iou: 0.10
  # 打斗后快速分开时，只要两鼠局部区域内重新出现两个实例，就不再进入CXX。
  visibility_region_padding_ratio: 0.60
  # 几乎重合的旧轨迹更可能是同一只鼠的重复ID，不据此新建遮挡簇。
  min_entry_separation_body_lengths: 0.30
  attack_min_active_frames: 2
  attack_motion_body_lengths_per_frame: 0.08
  recovery_cooldown_frames: 3
occlusion_recovery:
  # v1.39：启用局部二次检测；除聚集区外，也对刚开始漏检的正式轨迹做预测ROI恢复。
  enabled: true
  device: same
  imgsz: 1024
  conf: 0.025
  iou: 0.35
  extra_detections: 2
  max_regions_per_frame: 3
  batch_inference: true
  min_roi_size_px: 64
  half: true
  track_gap:
    enabled: true
    start_after_missing_frames: 1
    max_missing_frames: 30
    bbox_expand_ratio: 0.55
    missing_growth_ratio: 0.08
    max_expand_ratio: 1.60
    # 密集接触区里“预测位置附近已有框”通常只是邻鼠，不能据此取消丢失ID的ROI恢复。
    # ROI结果仍需去重、身份边际和跳变硬门，不会直接创建新正式ID。
    skip_when_detection_near_prediction: false
    block_distance_body_lengths: 0.55
    block_iou: 0.10
    max_regions_per_frame: 2
    retry_interval_frames: 2
scale:
  mode: body_length
  calibration_file: null
  cm_per_pixel: null
  assumed_mouse_body_length_cm: 8.0
  scale_smoothing_alpha: 0.05
features:
  # PPT追逐定义需要至少覆盖足够长的共同轨迹；2.5 s窗口仍低于60 cm事件的上限。
  history_seconds: 2.5
  response_lookback_seconds: 0.3
contact_detection:
  # 接触是独立的几何事件流，不是攻击/追逐分类；普通接触不会单独打开攻击FSM。
  enabled: true
  # A鼻头到B头部关键点的距离，以及A鼻头到B尾部关键点的距离。
  # 采用和攻击接触门一致的3 cm初始值，后续可用人工接触片段单独校准。
  nose_head_distance_cm: 3.0
  nose_tail_distance_cm: 3.0
wall_jump:
  # 单鼠靠墙跳跃/攀爬只作为排除门，不改变追踪结果。
  enabled: true
  max_edge_distance_body_lengths: 0.85
  min_speed_cm_s: 18.0
  min_acceleration_cm_s2: 80.0
  min_nose_speed_cm_s: 30.0
  min_outward_alignment: 0.35
  body_length_ratio_min: 0.62
  body_length_ratio_max: 1.55
  pose_quality_max_for_distortion: 0.35
  suppress_seconds: 0.35
chase:
  # v1.28.7：追逐必须是近距离连续施受关系；弱候选上限收紧到12 cm，强候选收紧到10 cm。
  weak:
    max_distance_cm: 12.0
    actor_min_speed_cm_s: 5.0
    target_min_speed_cm_s: 5.0
    direction_similarity_min: 0.70
    pursuit_alignment_min: 0.45
    target_escape_alignment_min: 0.35
    trajectory_correlation_min: 0.70
    require_all_conditions: true
    candidate_score_min: 9
    min_duration_seconds: 0.50
    fill_gap_seconds: 0.15
    min_path_cm: 60.0
    min_correlation_fraction: 0.70
    min_same_direction_fraction: 0.70
    min_proximity_fraction: 0.80
    min_role_consistency: 0.65
    max_wall_jump_fraction: 0.0
    # 帧级九条件很容易被一两帧姿态噪声打断；窗口门控整合短时追逐证据。
    window_gate_enabled: true
    window_seconds: 1.0
    window_min_valid_fraction: 0.80
    window_min_speed_cm_s: 5.0
    window_direction_similarity_min: 0.60
    window_pursuit_alignment_min: 0.35
    window_target_escape_alignment_min: 0.25
    window_min_proximity_fraction: 0.80
    window_min_moving_fraction: 0.55
    window_min_same_direction_fraction: 0.65
    window_min_pursuit_fraction: 0.70
    window_min_escape_fraction: 0.70
    window_min_path_cm: 10.0
    window_min_path_ratio: 2.00
    window_min_distance_change_cm: 3.0
    window_min_role_consistency: 0.60
    window_sustained_min_path_cm: 25.0
    window_sustained_same_direction_fraction: 0.70
    window_sustained_pursuit_fraction: 0.80
    window_sustained_escape_fraction: 0.75
    # ID跳变造成墙跳标志时，只用<=10 cm、持续同向且角色稳定的物理追逐恢复事件。
    near_recovery_gate_enabled: true
    near_recovery_min_duration_seconds: 0.40
    near_recovery_fill_gap_seconds: 0.10
    near_recovery_max_distance_cm: 10.0
    near_recovery_min_speed_cm_s: 5.0
    near_recovery_direction_similarity_min: 0.75
    near_recovery_pursuit_alignment_min: 0.55
    near_recovery_escape_alignment_min: 0.35
    near_recovery_correlation_min: 0.75
    near_recovery_min_role_consistency: 0.75
    near_recovery_min_mean_combined_speed_cm_s: 25.0
    # 近距离持续跟随：两鼠高速同向、保持前后关系时补足路径比接近1的追逐。
    close_follow_gate_enabled: true
    close_follow_min_duration_seconds: 0.75
    close_follow_fill_gap_seconds: 0.15
    close_follow_center_distance_min_cm: 5.0
    close_follow_center_distance_max_cm: 10.0
    close_follow_min_mean_combined_speed_cm_s: 25.0
    close_follow_direction_similarity_min: 0.70
    close_follow_min_same_direction_fraction: 0.50
    close_follow_pursuit_alignment_min: 0.35
    close_follow_min_pursuit_fraction: 0.50
    close_follow_escape_alignment_min: 0.25
    close_follow_min_escape_fraction: 0.55
    close_follow_trajectory_correlation_min: 0.55
    close_follow_min_correlation_fraction: 0.55
    close_follow_min_role_consistency: 0.50
    close_follow_max_wall_jump_fraction: 0.35
    cooccurring_attack_min_chase_path_cm: 40.0
  strong:
    max_distance_cm: 10.0
    actor_min_speed_cm_s: 8.0
    target_min_speed_cm_s: 8.0
    direction_similarity_min: 0.75
    pursuit_alignment_min: 0.60
    target_escape_alignment_min: 0.50
    trajectory_correlation_min: 0.75
    require_all_conditions: true
    candidate_score_min: 9
    min_duration_seconds: 0.60
    fill_gap_seconds: 0.10
    min_path_cm: 60.0
    min_correlation_fraction: 0.80
    min_same_direction_fraction: 0.80
    min_proximity_fraction: 0.90
    min_role_consistency: 0.75
    max_wall_jump_fraction: 0.0
    window_gate_enabled: true
    window_seconds: 1.25
    window_min_valid_fraction: 0.85
    window_min_speed_cm_s: 7.0
    window_direction_similarity_min: 0.70
    window_pursuit_alignment_min: 0.50
    window_target_escape_alignment_min: 0.40
    window_min_proximity_fraction: 0.90
    window_min_moving_fraction: 0.65
    window_min_same_direction_fraction: 0.75
    window_min_pursuit_fraction: 0.80
    window_min_escape_fraction: 0.80
    window_min_path_cm: 18.0
    window_min_path_ratio: 1.25
    window_min_distance_change_cm: 1.5
    window_min_role_consistency: 0.70
    window_sustained_min_path_cm: 45.0
    window_sustained_same_direction_fraction: 0.80
    window_sustained_pursuit_fraction: 0.85
    window_sustained_escape_fraction: 0.85
    # 强候选采用相同近距恢复思路，但要求更长、更快和更稳定。
    near_recovery_gate_enabled: true
    near_recovery_min_duration_seconds: 0.50
    near_recovery_fill_gap_seconds: 0.07
    near_recovery_max_distance_cm: 9.0
    near_recovery_min_speed_cm_s: 7.0
    near_recovery_direction_similarity_min: 0.80
    near_recovery_pursuit_alignment_min: 0.65
    near_recovery_escape_alignment_min: 0.50
    near_recovery_correlation_min: 0.80
    near_recovery_min_role_consistency: 0.80
    near_recovery_min_mean_combined_speed_cm_s: 35.0
    # 强候选只接受更快、更长且方向关系更稳定的近距离跟随。
    close_follow_gate_enabled: true
    close_follow_min_duration_seconds: 1.0
    close_follow_fill_gap_seconds: 0.10
    close_follow_center_distance_min_cm: 5.0
    close_follow_center_distance_max_cm: 9.0
    close_follow_min_mean_combined_speed_cm_s: 35.0
    close_follow_direction_similarity_min: 0.78
    close_follow_min_same_direction_fraction: 0.78
    close_follow_pursuit_alignment_min: 0.45
    close_follow_min_pursuit_fraction: 0.65
    close_follow_escape_alignment_min: 0.35
    close_follow_min_escape_fraction: 0.65
    close_follow_trajectory_correlation_min: 0.65
    close_follow_min_correlation_fraction: 0.65
    close_follow_min_role_consistency: 0.70
    close_follow_max_wall_jump_fraction: 0.20
    cooccurring_attack_min_chase_path_cm: 60.0
  strict_min_path_cm: 60.0
attack:
  # 文档先以鼻-尾<3 cm且接触bout<1 s标记潜在攻击，再用动态因果证据确认。
  weak:
    contact_distance_cm: 3.0
    stationary_fight_distance_cm: 5.0
    actor_lunge_speed_cm_s: 12.0
    rapid_closing_distance_cm: 3.0
    target_escape_speed_cm_s: 10.0
    target_escape_alignment_min: 0.45
    attack_pursuit_alignment_min: 0.65
    target_turn_angle_deg: 50.0
    head_motion_speed_cm_s: 16.0
    head_to_center_speed_ratio: 1.50
    repeated_contact_window_seconds: 2.0
    repeated_contact_count: 2
    # For attack specificity weak/strong share the same calibrated causal
    # floor; weak remains more permissive for chase, not for contact attacks.
    min_dynamic_evidence: 3
    # Anti-contact specificity calibrated from the three attack clips plus
    # the ordinary nose-head/nose-tail contact negatives.
    attack_direction_similarity_max: 0.85
    attack_direction_min_pose_deformation: 0.06
    attack_direction_min_target_turn_deg: 40.0
    attack_direction_min_distance_drop_cm: 8.0
    attack_direction_max_target_escape_alignment: 0.95
    impulse_min_distance_drop_cm: 8.0
    stationary_fight_max_center_speed_cm_s: 5.0
    stationary_fight_min_angular_speed_deg_s: 110.0
    min_duration_seconds: 0.12
    max_duration_seconds: 1.0
    fill_gap_seconds: 0.08
    min_contact_fraction: 0.50
    min_actor_initiation_fraction: 0.20
    min_target_reaction_fraction: 0.20
    min_dynamic_evidence_fraction: 0.25
    body_contact_distance_cm: 4.0
    min_body_contact_fraction: 0.25
    body_center_contact_distance_cm: 6.0
    min_body_center_contact_fraction: 0.25
    min_peak_combined_speed_cm_s: 40.0
    sustained_raw_min_frames: 5
    sustained_raw_min_fraction: 0.80
    max_wall_jump_fraction: 0.0
    # 鼻尾严格接触可能只出现1帧；高速冲击门控保留短促扑咬，同时排除普通接触。
    impulse_gate_enabled: true
    impulse_min_dynamic_evidence: 2
    impulse_min_combined_speed_cm_s: 80.0
    impulse_body_contact_distance_cm: 4.0
    impulse_center_contact_distance_cm: 6.0
    impulse_min_pose_pair_quality: 0.50
    # v1.28.1：骑跨/扭打是持续贴身、整体慢移但局部仍有扑动的攻击。
    # 该门只使用逐帧几何与动力学，不读取视频名、目录名或外部类别。
    grapple_gate_enabled: true
    grapple_min_duration_seconds: 0.85
    grapple_fill_gap_seconds: 0.10
    grapple_max_mean_combined_speed_cm_s: 20.0
    # A long whole-body contact must include a real wrestling/impact speed peak;
    # a 35 cm/s threshold admitted ordinary close-contact pose jitter.
    grapple_min_peak_combined_speed_cm_s: 50.0
    # 单个速度尖峰不再把整段普通贴靠标成攻击；要求90分位速度和因果攻击帧。
    grapple_speed_quantile: 0.90
    grapple_min_quantile_combined_speed_cm_s: 35.0
    grapple_min_raw_attack_frames: 1
    grapple_min_causal_frames: 2
    grapple_min_dynamic_evidence: 2
    grapple_min_dynamic_frames: 1
    grapple_min_pose_pair_quality: 0.45
    grapple_max_mean_direction_similarity: 0.75
    # Whole-body contact must also show approach, actor direction, or target turn.
    grapple_min_distance_drop_cm: 1.0
    grapple_min_pursuit_alignment: 0.50
    grapple_min_target_turn_angle_deg: 40.0
    grapple_max_wall_jump_fraction: 0.85
    # v1.31：仅当“两框重叠/合并、2变1少检、簇内快速运动、随后恢复”同时成立时补记攻击。
    occlusion_overlap_gate_enabled: true
    occlusion_require_exact_pair_size: true
    occlusion_min_overlap_iou: 0.12
    occlusion_min_motion_body_lengths_per_frame: 0.08
    occlusion_min_active_frames: 2
    occlusion_min_evidence_frames: 2
    occlusion_fill_gap_seconds: 0.20
    occlusion_pre_context_seconds: 0.50
    occlusion_recovery_context_seconds: 1.00
    occlusion_max_hidden_seconds: 3.00
    occlusion_pre_contact_center_distance_cm: 8.0
    occlusion_recovery_center_distance_cm: 12.0
    occlusion_min_context_dynamic_evidence: 1
    occlusion_min_context_combined_speed_cm_s: 20.0
    occlusion_min_context_dynamic_frames: 1
    occlusion_require_attack_oriented_context: true
    occlusion_max_wall_jump_fraction: 0.50
    occlusion_min_role_consistency: 0.50
  strong:
    contact_distance_cm: 3.0
    stationary_fight_distance_cm: 4.0
    actor_lunge_speed_cm_s: 12.0
    rapid_closing_distance_cm: 3.0
    target_escape_speed_cm_s: 10.0
    target_escape_alignment_min: 0.45
    attack_pursuit_alignment_min: 0.65
    target_turn_angle_deg: 50.0
    head_motion_speed_cm_s: 16.0
    head_to_center_speed_ratio: 1.50
    repeated_contact_window_seconds: 2.0
    repeated_contact_count: 2
    min_dynamic_evidence: 3
    attack_direction_similarity_max: 0.85
    attack_direction_min_pose_deformation: 0.06
    attack_direction_min_target_turn_deg: 40.0
    attack_direction_min_distance_drop_cm: 8.0
    attack_direction_max_target_escape_alignment: 0.95
    impulse_min_distance_drop_cm: 8.0
    stationary_fight_max_center_speed_cm_s: 4.0
    stationary_fight_min_angular_speed_deg_s: 140.0
    min_duration_seconds: 0.15
    max_duration_seconds: 1.0
    fill_gap_seconds: 0.05
    min_contact_fraction: 0.65
    min_actor_initiation_fraction: 0.30
    min_target_reaction_fraction: 0.30
    min_dynamic_evidence_fraction: 0.35
    body_contact_distance_cm: 3.5
    min_body_contact_fraction: 0.35
    body_center_contact_distance_cm: 5.5
    min_body_center_contact_fraction: 0.35
    min_peak_combined_speed_cm_s: 55.0
    sustained_raw_min_frames: 5
    sustained_raw_min_fraction: 0.85
    max_wall_jump_fraction: 0.0
    impulse_gate_enabled: true
    impulse_min_dynamic_evidence: 3
    impulse_min_combined_speed_cm_s: 70.0
    impulse_body_contact_distance_cm: 3.5
    impulse_center_contact_distance_cm: 5.5
    impulse_min_pose_pair_quality: 0.65
    # 强候选采用更长持续时间、更低平均位移和更高姿态质量。
    grapple_gate_enabled: true
    grapple_min_duration_seconds: 0.90
    grapple_fill_gap_seconds: 0.08
    grapple_max_mean_combined_speed_cm_s: 18.0
    # Keep the strong gate above the weak gate so low-energy investigation is not
    # promoted to attack when the stronger pose evidence is unavailable.
    grapple_min_peak_combined_speed_cm_s: 55.0
    grapple_speed_quantile: 0.90
    grapple_min_quantile_combined_speed_cm_s: 45.0
    grapple_min_raw_attack_frames: 2
    grapple_min_causal_frames: 3
    grapple_min_dynamic_evidence: 3
    grapple_min_dynamic_frames: 2
    grapple_min_pose_pair_quality: 0.60
    grapple_max_mean_direction_similarity: 0.65
    # Strong grappling uses stricter pursuit and turn evidence as well.
    grapple_min_distance_drop_cm: 1.5
    grapple_min_pursuit_alignment: 0.65
    grapple_min_target_turn_angle_deg: 50.0
    grapple_max_wall_jump_fraction: 0.75
    # 强候选要求更深重叠、更快簇内运动、更多连续物证和更稳定的发起方向。
    occlusion_overlap_gate_enabled: true
    occlusion_require_exact_pair_size: true
    occlusion_min_overlap_iou: 0.16
    occlusion_min_motion_body_lengths_per_frame: 0.12
    occlusion_min_active_frames: 3
    occlusion_min_evidence_frames: 3
    occlusion_fill_gap_seconds: 0.12
    occlusion_pre_context_seconds: 0.40
    occlusion_recovery_context_seconds: 0.75
    occlusion_max_hidden_seconds: 2.00
    occlusion_pre_contact_center_distance_cm: 6.0
    occlusion_recovery_center_distance_cm: 10.0
    occlusion_min_context_dynamic_evidence: 2
    occlusion_min_context_combined_speed_cm_s: 30.0
    occlusion_min_context_dynamic_frames: 2
    occlusion_require_attack_oriented_context: true
    occlusion_max_wall_jump_fraction: 0.35
    occlusion_min_role_consistency: 0.67
# v1.43 Standard Behavior Engine
# 核心：Feature -> Continuous Evidence -> Role -> FSM -> Event。
# 旧 strict/window/near/grapple/occlusion gate 只作为 evidence provider，
# 不再直接 OR 成最终标签。decision_mode=shadow 可进行无风险A/B。
standard_behavior_engine:
  enabled: true
  decision_mode: standard   # standard / shadow / legacy
  # 轻量路径保留完整时间轴，但窗口外 valid_pair=false 的行不再计算
  # 双向连续证据；FSM仍接收硬否决行以重置状态。设为false可做结果A/B。
  skip_inactive_rows: true

  # Observation Quality。低质量帧可以维持已存在事件，但不能单独开启新事件。
  quality:
    track_state_quality:
      tracked: 1.0
      tentative: 0.65
      suspicious: 0.35
      reid_ambiguous: 0.20
      lost: 0.0
      default: 0.50

  # Interaction Graph先定义“可能相互作用”的空间边；当前默认不裁剪pair计算，
  # 因而不会改变原SQLite/负样本覆盖。验证后可将prune_pair_computation设true。
  interaction_graph:
    enabled: true
    buffer_cm: 5.0
    radius_cm: 17.0
    prune_pair_computation: false

  # 连续追逐证据权重。总和为1；阈值附近使用fuzzy membership而非0/1跳变。
  chase_weights:
    distance: 0.15
    actor_speed: 0.10
    target_speed: 0.10
    direction: 0.10
    pursuit: 0.20
    escape: 0.15
    behind: 0.10
    trajectory: 0.10
  behind_zero: -0.10
  behind_full: 0.55
  # 体坐标系中逐关键点RMS形变，单位为body-length/frame。
  # 去除了整体平移、旋转和尺度后，仅保留身体内部姿态变化。
  pose_deformation_zero: 0.015
  pose_deformation_full: 0.10
  # 老版成对特征没有 a_to_b/b_to_a 方向运动列时，保留已有 selected
  # actor/target 作为低置信度 role hint；仅在连续方向证据完全打平时启用。
  selected_role_fallback:
    enabled: true
    confidence: 0.20

  weak:
    provider_floors:
      chase: 0.70
      dynamic_attack: 0.70
      grapple: 0.72
      occlusion: 0.78
    chase_fsm:
      approach_enter_score: 0.45
      # Calibrated on the supplied chase/attack and nose-contact clips:
      # longer confirmation removes sustained contact false positives while
      # retaining the two separable chase clips.
      enter_score: 0.70
      exit_score: 0.44
      min_role_confidence: 0.08
      min_quality_to_open: 0.42
      min_quality_to_hold: 0.20
      confirm_seconds: 0.80
      exit_hold_seconds: 0.20
    attack_fsm:
      # Attack opening requires the calibrated physical-causality gate.  A
      # close nose-head/nose-tail contact by itself remains CONTACT, not ATTACK.
      require_causal_attack_gate: true
      specificity_hold_seconds: 0.35
      min_dynamic_gate_frames: 2
      min_stationary_gate_frames: 2
      dynamic_gate_count_window_seconds: 2.0
      causal_max_center_distance_cm: 7.6
      prepare_enter_score: 0.55
      contact_enter_score: 0.62
      reaction_enter_score: 0.52
      dynamic_confirm_score: 0.62
      grapple_confirm_score: 0.66
      occlusion_confirm_score: 0.70
      exit_score: 0.34
      min_quality_to_open: 0.40
      min_quality_to_hold: 0.18
      min_role_confidence: 0.06
      pre_contact_seconds: 0.50
      reaction_window_seconds: 0.65
      grapple_confirm_seconds: 0.35
      exit_hold_seconds: 0.25

  strong:
    provider_floors:
      chase: 0.78
      dynamic_attack: 0.80
      grapple: 0.82
      occlusion: 0.86
    chase_fsm:
      approach_enter_score: 0.52
      enter_score: 0.75
      exit_score: 0.52
      min_role_confidence: 0.12
      min_quality_to_open: 0.52
      min_quality_to_hold: 0.28
      confirm_seconds: 0.40
      exit_hold_seconds: 0.15
    attack_fsm:
      require_causal_attack_gate: true
      specificity_hold_seconds: 0.35
      min_dynamic_gate_frames: 2
      min_stationary_gate_frames: 2
      dynamic_gate_count_window_seconds: 2.0
      causal_max_center_distance_cm: 7.6
      prepare_enter_score: 0.64
      contact_enter_score: 0.70
      reaction_enter_score: 0.62
      dynamic_confirm_score: 0.72
      grapple_confirm_score: 0.76
      # Attack1 is an occlusion-dominant clip. Its continuous occlusion
      # evidence peaks around 0.75, so 0.80 made the strong tier miss it.
      occlusion_confirm_score: 0.64
      exit_score: 0.42
      min_quality_to_open: 0.52
      min_quality_to_hold: 0.26
      min_role_confidence: 0.10
      pre_contact_seconds: 0.45
      reaction_window_seconds: 0.55
      grapple_confirm_seconds: 0.45
      exit_hold_seconds: 0.18

# 事件级鼠对校正：只在追逐/攻击已经被检测到后重选参与鼠，不读取视频名或目录。
behavior_reconciliation:
  enabled: true
  # v1.43 standard模式：pair可复核，但FSM输出的actor/target（包括-1=不确定）不可被旧共识强行改写。
  preserve_standard_role_direction: true
  # 只允许同一无序ID对内部校正；禁止把事件转移到画面另一对鼠。
  allow_cross_pair_reassignment: false
  # 通用回退值供旧配置兼容；具体行为使用下面各自的上下文。
  pair_context_seconds: 1.00
  # 追逐使用前后2秒覆盖高速ID互换前后的完整运动证据。
  chase_pair_context_seconds: 2.00
  # 攻击只使用前后1秒，避免相邻普通接触或其他鼠对抢占扭打事件。
  attack_pair_context_seconds: 1.00
  # 相邻碎片先组成同一物理行为段，再共享鼠对和发起方向，避免漏检或ID互换导致片段各自选错。
  pair_bout_gap_seconds: 0.75
  # 追逐必须在多帧获得高分，并且发起方向明显偏向同一只鼠。
  chase_high_score: 7.0
  chase_support_score: 6.0
  chase_min_high_frames: 8
  chase_min_high_fraction: 0.04
  chase_max_support_distance_cm: 10.0
  chase_min_role_consistency: 0.65
  # 攻击鼠对要求持续动态证据和更近的身体距离。
  attack_high_evidence: 4.0
  attack_support_evidence: 3.0
  attack_min_high_frames: 5
  attack_min_high_fraction: 0.025
  attack_max_support_distance_cm: 8.0
  attack_min_role_consistency: 0.52
  # 追逐中断超过0.20秒即视为新事件，避免把普通同向移动串成追逐。
  chase_merge_gap_seconds: 0.20
  # 扭打会短时漏掉一只鼠；同一校正鼠对与方向可跨0.75秒续接，不要求重现于完全相同坐标。
  attack_merge_gap_seconds: 0.75
  # 骑乘遮挡期间允许目标无独立框；分开后用新出现且持续贴近的正式ID回溯。
  mount_backfill_enabled: false
  mount_min_hidden_seconds: 0.80
  mount_min_post_close_seconds: 0.40
  mount_post_window_seconds: 1.00
  mount_max_center_distance_body_lengths: 0.65
clips:
  # 事件片段从完整标注视频裁剪，片段中保留框、骨架、ID和行为标签。
  source_video: annotated
  fixed_clip_seconds: 5.0
  min_clip_start_interval_seconds: 5.0
  min_interval_scope: global
  pre_padding_seconds: 1.5
  post_padding_seconds: 1.5
  extract_hard_negatives: true
  hard_negative_close_distance_cm: 12.0
  hard_negative_min_speed_cm_s: 6.0
  hard_negative_clip_seconds: 5.0
  hard_negative_min_interval_seconds: 5.0
  max_hard_negative_clips: 200
  replace_on_stage2: true
evaluation:
  temporal_iou_threshold: 0.1
  boundary_tolerance_seconds: 0.5
  error_clip_padding_seconds: 1.5
output:
  # 当前轻量推理不生成渲染视频；旧完整路径的渲染代码和开关仍保留。
  save_annotated_video: false
  save_behavior_label_video: false
  # 只需要稳定ID核查视频时，可设true或命令行添加--tracking-only。
  tracking_only: false

# 当前推理默认启用的轻量行为路径。
# 开启后只执行：YOLO Pose预推理缓存 -> 轻量位置/关键点追踪 -> 追逐/攻击行为判定。
# 完整遮挡恢复、ReID、Mask、ROI二次推理、完整行为流水线和旧渲染代码均保留，
# 但本次不会被构造或调用；需要恢复原流程时使用--full-behavior。
lightweight_behavior_inference:
  enabled: true
  expected_mice: 20
  # 轻量默认每3帧取1帧；需要逐帧高召回时可显式改成1。
  sample_stride: 3
  # 先用中心距离和身体朝向筛选有意义的鼠对，再计算昂贵的关键点几何与行为特征。
  # close_distance_cm 是接触/攻击的近距离兜底；更远的鼠对至少一方需要朝向另一方。
  pair_prefilter:
    enabled: true
    close_distance_cm: 10.0
    min_heading_cosine: 0.0
    window:
      enabled: true
      padding_seconds: 2.5
      fill_gap_seconds: 0.15
  # 留空表示使用当前视频输出目录下的yolo_precompute；也支持{video_stem}/{video_name}。
  # 自定义路径只复用已完成缓存，缓存不存在时仍在默认输出目录生成。
  yolo_cache_dir: ""
  # 主分类只输出独立的chase/attack事件；四类原始片段仅保留为显式兼容入口。
  extract_four_class_clips: false
  clips_output_dir: 四类视频
  clip_level: strong
  clip_seconds: 5.0
  clip_min_start_interval_seconds: 5.0
  max_clips_per_class: 200
  # 当前明确不渲染；需要时可改为true或使用专门的渲染入口。
  render_video: false
  render_output: 轻量行为推理_渲染.mp4
  max_frames: null

# Extended Beiyi ethogram for the lightweight cache path.  These labels are
# emitted in addition to, and never instead of, the legacy chase/attack events
# and the independent nose-head/nose-tail contact CSV.
extended_behavior:
  enabled: true
  individual:
    stationary_max_speed_cm_s: 4.0
    walking_max_speed_cm_s: 18.0
    running_min_speed_cm_s: 18.0
    confirm_seconds: 0.30
    fill_gap_seconds: 0.20
    min_pose_quality: 0.20
  social:
    pair_max_distance_cm: 17.0
    together_max_distance_cm: 8.0
    together_max_combined_speed_cm_s: 28.0
    approach_min_distance_drop_cm: 1.5
    approach_min_closing_speed_cm_s: 2.0
    approach_max_actor_speed_cm_s: 22.0
    approach_max_target_speed_cm_s: 22.0
    approach_min_speed_gap_cm_s: 1.5
    approach_min_actor_speed_cm_s: 3.0
    approach_allow_together_transition: true
    approach_min_duration_seconds: 0.10
    # Short-event context extends only the public display/export interval;
    # analysis_start/end remain the evidence frames.
    approach_short_event_padding_seconds: 0.10
    approach_short_event_max_duration_seconds: 0.35
    chase_fallback:
      enabled: true
      max_distance_cm: 12.0
      min_score: 0.70
      min_actor_speed_cm_s: 3.0
      min_target_speed_cm_s: 2.5
      min_pursuit_alignment: 0.40
      min_target_escape_alignment: 0.30
      min_direction_similarity: 0.55
      min_role_confidence: 0.04
      min_duration_seconds: 0.25
      fill_gap_seconds: 0.15
      short_event_padding_seconds: 0.10
      short_event_max_duration_seconds: 0.60
    attack_fallback:
      enabled: true
      max_distance_cm: 7.6
      min_dynamic_score: 0.78
      min_context_frames: 1
      min_attack_evidence: 3
      # A single analyzed frame is not a reliable attack event.  It may remain
      # visible in diagnostics, but it cannot enter the behavior CSV or render.
      min_confirmed_frames: 2
      support_window_seconds: 0.20
      min_raw_actor_speed_cm_s: 8.0
      min_impact_pursuit_alignment: 0.55
      max_impact_target_escape_alignment: 0.10
      min_impact_behavior_speed_gap_cm_s: 1.5
      min_impact_actor_acceleration_cm_s2: 120.0
      min_impact_initiation_score: 0.90
      min_rebound_target_escape_alignment: 0.55
      max_rebound_pursuit_alignment: 0.20
      min_rebound_post_distance_increase_cm: 0.50
      min_rebound_immediate_distance_increase_cm: 0.25
      rebound_distance_window_seconds: 0.10
      min_rebound_reaction_score: 0.70
      min_rebound_contact_pursuit_alignment: 0.55
      min_target_turn_angle_deg: 25.0
      min_target_nose_speed_cm_s: 12.0
      min_role_confidence: 0.04
      min_duration_seconds: 0.033
      fill_gap_seconds: 0.10
      short_event_padding_seconds: 0.15
      short_event_max_duration_seconds: 0.40
      # Narrow recovery for a high-evidence attack that is shorter than the
      # causal FSM confirmation window.
      short_recovery:
        enabled: true
        min_attack_score: 0.80
        max_distance_cm: 9.0
        min_raw_actor_speed_cm_s: 8.0
        min_attack_evidence: 2
        min_role_confidence: 0.04
        min_support_frames: 2
        support_window_seconds: 0.20
        min_support_attack_score: 0.70
        min_support_dynamic_score: 0.65
        min_support_raw_actor_speed_cm_s: 6.0
        min_escape_alignment: 0.65
        min_pursuit_alignment: 0.60
        min_initiation_score: 0.85
        max_rebound_pursuit_alignment: 0.10
        min_reaction_score: 0.70
        min_duration_seconds: 0.033
    avoidance_min_target_escape_alignment: 0.45
    avoidance_min_target_speed_cm_s: 1.5
    avoidance_min_distance_increase_cm: 1.0
    avoidance_min_actor_speed_cm_s: 1.5
    avoidance_max_distance_cm: 17.0
    avoidance_require_pursuit_context: true
    avoidance_context_seconds: 1.00
    avoidance_close_context_distance_cm: 10.0
    avoidance_min_pursuit_alignment: 0.35
    avoidance_min_prior_distance_drop_cm: 0.50
    avoidance_min_duration_seconds: 0.10
    avoidance_short_event_padding_seconds: 0.10
    avoidance_short_event_max_duration_seconds: 0.35
    # A one-frame escape is accepted only with close context and clear
    # target-escape geometry; arbitrary separation remains rejected.
    avoidance_short_recovery:
      enabled: true
      max_distance_cm: 10.0
      min_target_escape_alignment: 0.70
      min_target_speed_cm_s: 2.0
      min_actor_speed_cm_s: 2.0
      min_distance_increase_cm: 1.0
      min_duration_seconds: 0.033
    pair_fill_gap_seconds: 0.15
  group:
    huddle_distance_cm: 9.0
    huddle_fraction: 0.55
    huddle_min_cluster_size: 3
    huddle_min_cluster_fraction: 0.30
    huddle_min_cluster_density: 0.50
    isolation_distance_cm: 15.0
    isolation_neighbor_fraction: 0.15
    confirm_seconds: 0.30
    fill_gap_seconds: 0.20

# Orthogonal temporal state machines for the lightweight ethogram.  The
# detector thresholds above remain unchanged; this layer only manages temporal
# confirmation/recovery for individual, pair, group and contact regions.
parallel_behavior_fsm:
  # false 会关闭由并行 FSM 聚合的接触、个体、群体和扩展 pair 事件；
  # 标准行为引擎自己的 chase/attack FSM 不受此开关影响。
  enabled: true
  # 当前唯一受支持的执行模式。未知值会直接报错，避免配置与实际执行不一致。
  mode: active
  version: parallel_hierarchical_fsm_v1
  # 调试时改为 true 可保留每个区域的逐帧状态；正常分析只输出最终事件，避免额外内存和数组分配。
  collect_diagnostics: false

# 阶段二可视化只消费正式ID。插值仅连接前后真实观测；视频首尾可短时零速度保持，二者均不进入行为计算。
stage2_render:
  # 仅在同一正式ID的前后真实观测都存在且端点速度合理时插值；
  # 15帧可覆盖本次墙边遮挡的13帧缺口，不产生无终点的自由预测框。
  interpolate_max_gap_frames: 15
  interpolate_max_speed_body_lengths_per_frame: 0.65
  interpolate_confidence_decay: 0.96
  # 仅处理视频绝对首尾没有第二端点的短缺口，原地保持最近真实框；不使用速度或加速度外推。
  endpoint_hold_max_frames: 10
  endpoint_hold_confidence_decay: 0.92
  single_frame_outlier_body_lengths: 0.80
  show_arena_boundary: true
video_encoding:
  # v1.42.1: only changes how rendered MP4 frames are encoded; analysis state,
  # CSV/JSON and behavior decisions are produced before encoding.
  prefer_nvenc: true
  codec: h264_nvenc
  preset: p4
  cq: 23
  fallback_fourcc: mp4v

profiling:
  # 调试时改为 true；默认关闭，避免在常规推理中引入计时和日志开销。
  enabled: true
  report_interval_frames: 50
resource_monitor:
  enabled: true
  sample_interval_seconds: 2.0
  gpu_index: 0
performance:
  # 外层Mask ROI线程池开启时，限制OpenCV内部线程，避免每个ROI任务再次并行导致CPU超卖。
  opencv_threads: 1
  # 同一帧不同小鼠的GrabCut/纹理/颜色描述并行；主线程仍按原检测顺序写回。
  mask_workers: 4
  mask_parallel_min_detections: 3
  # Exact hard-gate cascade before expensive identity terms.  In sparse
  # 20-mouse frames only physically possible track×detection cells receive the
  # full scalar base cost; dense contact frames keep the vectorized backend.
  identity_cascade:
    enabled: true
    min_cells: 64
    sparse_density_threshold: 0.35
  # Mask trigger is wired in v1.42.1. Strict mode is the FINAL default because
  # mask descriptors currently carry nonzero identity/ReID weights; aggressive
  # skipping must only be enabled after representative A/B regression passes.
  mask_trigger:
    enabled: true
    result_preserving_only: true
    overlap_iou_threshold: 0.02
    force_refresh_interval_frames: 15
  # 只批量化track×detection代价矩阵；ID创建、Hungarian提交和轨迹状态更新仍串行。
  # 可设为python做逐元素回归基线。
  identity_cost_backend: auto
  # 近似平局时自动回退旧标量矩阵，保护Hungarian tie-break和ID稳定性。
  identity_cost_tie_fallback_epsilon: 1.0e-10
  # C++ 扩展不可用、ABI不匹配或自检失败时自动回退 NumPy。
  identity_cpp_threads: 1
  # 正常20×20矩阵单线程更快；只在大离线矩阵上自动开启2/4线程。
  identity_cpp_auto_threads: true
  identity_cpp_max_threads: 4
  identity_cpp_parallel_min_cells: 16384
  identity_cpp_selftest: true
  identity_cpp_fallback_on_tie: true
  # 渲染/编码只按提交顺序异步执行，队列满时回压，不改变轨迹和CSV。
  async_render: true
  render_queue_size: 16
  # 坏骨架和接触簇ROI统一批量提交；模型不支持时自动逐ROI回退。
  batch_roi_inference: true
  # 后台只预取下一帧检测结果；主线程仍严格按帧顺序更新ID和行为状态。
  prefetch_inference: true
  prefetch_queue_size: 1
  # 严格两阶段模式：先按批次完成整段视频的YOLO Pose推理并持久化，
  # 再按原帧序执行候选过滤、身份追踪、遮挡恢复、阶段3缓存和行为步骤4-7。
  # 不把整段视频放入内存；每个缓存分块只保留有限帧的检测数值结果。
  yolo_first_pass:
    enabled: true
    batch_size: 4
    cache_chunk_frames: 300
  # Keep the established one-pass behavior path as the compatibility baseline.
  # Set to staged to persist steps 1-3 first and run steps 4-7 afterwards.
  behavior_pipeline: staged
  # Pair backend options: python (exact baseline), numpy (vectorized geometry),
  # or multiprocess (chunked stage-4 calculation with deterministic ordering).
  # 阶段4-7使用独立进程计算鼠对，主进程继续按帧顺序汇总，保证结果可复现。
  pair_compute_mode: multiprocess
  pair_workers: 4
  stage3_cache_chunk_frames: 300
  pair_benchmark: false
  pair_benchmark_repeats: 200
  # 仅在整段视频和行为结果成功落盘后清理可重建缓存；中断或异常时保留缓存续跑。
  # 阶段一缓存是后续任意阈值/分类/渲染复算的正式输入，成功后也必须保留。
  cleanup_caches_on_success: false
clean_dataset:
  max_other_event_overlap_fraction: 0.1
  min_pose_pair_quality: 0.3
memory:
  sqlite_batch_rows: 1500
  gc_interval_frames: 60
  keep_raw_sqlite: false
