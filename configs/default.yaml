behavior_parameter_units:
  schema_version: 1
  arena_side_cm: 74.0
  reference_body_length_cm: 7.918
  reference_body_width_cm: 3.068558
  reference_body_length_definition: nose_tip_to_tail_base
  migrated_from_body_length_cm: 10.7
  migrated_from_body_width_cm: 4.1467
  migration_factor: 0.74
  status: rescaled_for_74_cm_square_arena

# Behavior-analysis configuration. Visual tracking is owned by Ultralytics;
# true animal identity is supplied by an optional mTrack/RFID identity map.
repository:
  config_schema_version: '2'
  profile: default
  trajectory_source: ultralytics_track
  identity_source: visual_or_mtrack_rfid
adaptive_arena:
  enabled: true
  mode: learned
  boundary_expansion_ratio: 0.97
  reuse_boundary_json: ''
  reuse_require_video_match: true
  min_box_confidence: 0.12
  min_pose_quality: 0.08
  min_motion_px_per_frame: 1.5
  max_motion_px_per_frame: 120.0
  min_motion_samples: 300
  long_track_min_frames: 30
  max_track_gap_frames: 2
  heatmap_cell_px: 20
  heatmap_blur_sigma_cells: 1.25
  heatmap_positive_quantile: 0.2
  heatmap_min_density: 0.08
  heatmap_close_radius_cells: 3
  heatmap_dilate_radius_cells: 2
  min_boundary_area_ratio: 0.2
  max_boundary_area_ratio: 0.95
  hard_gate_tolerance_px: 2.0
scale:
  # # [STEP4+ 2026-10-05] 逐视频体长尺度成为默认分析路径（用户规定流程）：默认逐视频尺度 = 统一实测体长(7.918 cm, 来自 configs/scale/rig_a.json
  # subject_metrics) / 该视频鼻-尾基像素中位数；距离与速度分析均消费该尺度。
  # mode: calibration 保留为 rig 级固定尺度/homography 手动覆盖。
  mode: body_length
  calibration_file: configs/scale/rig_a.json
  cm_per_pixel: null
  # Reference body length for modes without calibration subject metrics;
  # keep in sync with rig_a.json subject_metrics.unified_body_length_cm.
  assumed_mouse_body_length_cm: 7.918
  # Measured hip span; used only when observed width samples are missing.
  assumed_mouse_body_width_cm: 3.068558
  scale_smoothing_alpha: 0.05
features:
  history_seconds: 2.5
  response_lookback_seconds: 0.3
hierarchical_heuristic_core:
  # Reference seed values for the compositional rule core. Distances and
  # movement cutoffs are calibration starting points, not validated constants.
  motion:
    # [STEP4 2026-10-04] 个体层合并：Walking+Running -> Locomotion（用户决策/文档）
    running_min_speed_cm_s: 53.5  # 保留：Chasing 高速移动下限
    moving_min_speed_cm_s: 0.66875
    static_max_speed_cm_s: 0.66875
    locomotion_min_duration_s: 0.5
    static_min_duration_s: 1.0
    static_max_center_radius_cm: 1.3375
    static_max_transient_duration_s: 0.2
    static_max_transient_displacement_cm: 1.3375
    static_min_projected_body_length_ratio: 0.55
    # walking_min_speed_cm_s: 0.5
    # walking_max_speed_cm_s: 40.0
    # running_min_duration_s: 0.5
    # walking_min_duration_s: 1.0
    # running_min_directionality: 0.65
    # walking_min_active_fraction: 0.4
  social:
    # # [STEP6 2026-10-05] 社交/群体参数按文档 v4 + 用户覆盖落地
    together_max_distance_cm: 7.0
    together_min_distance_cm: 4.0125
    approach_final_distance_cm: 6.6875
    # [SUSPENDED-STEP3 2026-10-04] Following/Avoiding 暂停（用户决策），保留代码待恢复
    # following_min_distance_cm: 5.0
    # following_max_distance_cm: 30.0
    min_contact_duration_s: 0.5
    chasing_max_distance_cm: 16.05
    chasing_min_speed_cm_s: 26.75
    chasing_min_duration_s: 1.0
    # following_min_duration_s: 3.0
    together_min_duration_s: 1.0
    approach_min_duration_s: 0.0
    # avoiding_min_duration_s: 0.0
    contact_distance_cm: 2.675
    min_heading_similarity: 0.707
    approach_min_closing_speed_cm_s: 2.675
    # avoiding_min_speed_cm_s: 10.0
    # avoiding_min_turn_deg: 50.0
  attack:
    min_conflict_score: 0.6
    rapid_closing_weight: 0.15
    pounce_or_bite_weight: 0.25
    entanglement_weight: 0.2
    local_motion_weight: 0.15
    observation_loss_weight: 0.1
    recovery_escape_weight: 0.15
