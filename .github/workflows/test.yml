name: tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "agent/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Compile source and scripts
        run: python -m compileall -q src scripts tests
      - name: Check repository boundaries
        run: python tools/check_repository.py
